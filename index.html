e(e.pointerId)});c.addEventListener('pointermove',e=>{if(pointer)pointer={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',()=>pointer=null);
function monster(){let a=rand()*Math.PI*2,r=Math.max(W,H)*.65;let kind=rand(),type=kind<.52?0:kind<.83?1:2;enemies.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,type,hp:[30,44,24][type]+elapsed*.085,max:[30,44,24][type]+elapsed*.085,speed:[53,42,87][type]+Math.min(38,elapsed*.06),hit:0})}function nearest(range){let best=null,d=range*range;for(const e of enemies){let v=(e.x-p.x)**2+(e.y-p.y)**2;if(v<d){d=v;best=e}}return best}function projectile(target,type){if(!target)return;shots.push({x:p.x,y:p.y,tx:target.x,ty:target.y,vx:0,vy:0,type,life:2});let s=shots[shots.length-1],dx=target.x-p.x,dy=target.y-p.y,l=Math.hypot(dx,dy)||1;s.vx=dx/l*(type==='light'?720:420);s.vy=dy/l*(type==='light'?720:420)}function damage(e,d){e.hp-=d;e.hit=.15;effects.push({x:e.x,y:e.y,text:String(Math.round(d)),t:.55});if(e.hp<=0){kills++;gems.push({x:e.x,y:e.y,v:e.type===1?3:2});enemies.splice(enemies.indexOf(e),1)}}function level(){state='level';const opts=[['🔥 火球術 +1','提升火球傷害',()=>p.fire++],['⚡ 雷擊術 +1','提升雷擊傷害',()=>p.light++],['❄️ 暴風雪','解鎖或強化範圍冰系攻擊',()=>p.ice++],['❤️ 生命強化','最大 HP +35 並恢復生命',()=>{p.max+=35;p.hp=Math.min(p.max,p.hp+55)}],['👟 移動速度','移動速度 +12%',()=>p.speed*=1.12]];if(p.career===0){opts.splice(0,3,['🗡️ 重擊 +1','增加重擊傷害',()=>p.bash++],['💚 緊急治療 +1','增加治療量',()=>p.aid++],['💤 裝死 +1','減少冷卻時間',()=>p.deadLv++])}opts.sort(()=>rand()-.5);show('升級！ Lv.'+p.lv,'選擇一項能力強化',opts.slice(0,3).map(([a,b,fn])=>[a+' — '+b,()=>{fn();state='play';$('overlay').classList.add('hide');last=performance.now()}]))}function update(dt){if(devOpen||rpgOpen)return;elapsed+=dt;careerUpgrade();if(state!=='play')return;p.inv=Math.max(0,p.inv-dt);p.aidCd=Math.max(0,p.aidCd-dt);p.deadCd=Math.max(0,p.deadCd-dt);p.deadTime=Math.max(0,p.deadTime-dt);if(p.aid>0&&p.hp<p.max*.6&&p.aidCd===0){let heal=Math.ceil(p.max*(.08+.025*p.aid));p.hp=Math.min(p.max,p.hp+heal);p.aidCd=15;effects.push({x:p.x,y:p.y,text:'+'+heal,t:.7})}if(p.deadLv>0&&p.hp<p.max*.25&&p.deadCd===0&&p.deadTime===0){p.deadTime=3;p.deadCd=Math.max(20,45-4*(p.deadLv-1));p.inv=Math.max(p.inv,3.8);effects.push({x:p.x,y:p.y,text:'裝死！',t:1})}let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));if(pointer){dx=(pointer.x-W/2)/100;dy=(pointer.y-H/2)/100}let len=Math.hypot(dx,dy);if(p.deadTime>0){dx=0;dy=0;len=0}if(len>0){p.x+=dx/Math.max(1,len)*p.speed*dt;p.y+=dy/Math.max(1,len)*p.speed*dt}spawn-=dt;if(spawn<=0&&enemies.length<200){monster();spawn=Math.max(.14,.65-elapsed*.003)}p.fireCd-=dt;p.lightCd-=dt;p.iceCd-=dt;p.meleeCd-=dt;let combat=compute();if(p.deadTime===0&&p.meleeCd<=0){let near=nearest(65);if(near){let hit=combat.atk*p.power*(rand()<combat.crit?1.5:1);damage(near,hit);p.meleeCd=1/combat.aspd}}if(p.fireCd<=0&&p.deadTime===0){let target=nearest(p.career===0?85:500);if(target&&(p.career===0?p.bash>0:p.fire>0)){projectile(target,p.career===0?'bash':'fire');p.fireCd=p.career===0?3:Math.max(.35,1.25-p.fire*.06)}}if(p.career>0&&p.light>0&&p.deadTime===0&&p.lightCd<=0){projectile(nearest(550),'light');p.lightCd=Math.max(.38,1.7-p.light*.085)}if(p.ice>0&&p.deadTime===0&&p.iceCd<=0){for(const e of [...enemies])if(Math.hypot(e.x-p.x,e.y-p.y)<175)damage(e,(15+p.ice*11)*p.power);effects.push({x:p.x,y:p.y,ring:175,t:.4});p.iceCd=Math.max(1.1,3.8-p.ice*.25)}for(const e of enemies){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(Math.hypot(e.x-p.x,e.y-p.y)<26&&p.inv<=0&&p.deadTime===0){if(rand()>=combat.dodge)p.hp-=Math.max(1,10-p.stats.VIT*.07);p.inv=.55;if(p.hp<=0){p.hp=0;state='dead';show('冒險結束！',`存活 ${Math.floor(elapsed)} 秒　擊殺 ${kills} 隻怪物`,[['再挑戰一次',reset]])}}}for(const s of [...shots]){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let hit=enemies.find(e=>Math.hypot(e.x-s.x,e.y-s.y)<24);if(hit){damage(hit,(s.type==='bash'?(15+9*p.bash+combat.atk*.8):s.type==='fire'?(17+p.fire*12+combat.matk*.6):(24+p.light*15+combat.matk*.6))*p.power);s.life=0}if(s.life<=0)shots.splice(shots.indexOf(s),1)}for(const g of [...gems]){let dist=Math.hypot(g.x-p.x,g.y-p.y);if(dist<120){let k=Math.min(1,dt*8);g.x+=(p.x-g.x)*k;g.y+=(p.y-g.y)*k}if(dist<24){gems.splice(gems.indexOf(g),1);expGain(g.v,g.v*2);}}for(const fx of [...effects]){fx.t-=dt;if(fx.t<=0)effects.splice(effects.indexOf(fx),1)}updateHud()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function render(){ctx.fillStyle='#6b9252';ctx.fillRect(0,0,W,H);let cx=W/2,cy=H/2,px=p?p.x:0,py=p?p.y:0;const sx=x=>cx+x-px,sy=y=>cy+(y-py)*.78;let tile=90,startX=Math.floor((px-W/2)/tile)-1,endX=Math.ceil((px+W/2)/tile)+1,startY=Math.floor((py-H/.78/2)/tile)-1,endY=Math.ceil((py+H/.78/2)/tile)+1;for(let i=startX;i<=endX;i++)for(let j=startY;j<=endY;j++){let h=((i*73856093)^(j*19349663))>>>0,x=sx(i*tile+((h%55)-27)),y=sy(j*tile+((h>>>8)%60-30));ellipse(x,y,3+h%5,2+h%3,h%3===0?'#8baa65':'#588449');if(h%13===0){ctx.strokeStyle='#527c3c';ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x+k*4,y);ctx.lineTo(x+k*4-3,y-8-k*2);ctx.stroke()}}}if(p){for(const g of gems){let x=sx(g.x),y=sy(g.y);ctx.fillStyle='#62dcff';ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-6,-6,12,12);ctx.restore()}let entities=[...enemies.map(e=>({y:e.y,e})),{y:p.y,player:true}].sort((a,b)=>a.y-b.y);for(const o of entities){if(o.player){let x=cx,y=cy;ellipse(x,y+20,18,7,'#29452b88');if(p.inv>0&&Math.floor(p.inv*12)%2)ctx.globalAlpha=.5;ctx.fillStyle='#fff1c9';ctx.beginPath();ctx.arc(x,y-14,11,0,7);ctx.fill();ctx.fillStyle='#69463a';ctx.beginPath();ctx.arc(x,y-20,12,Math.PI,6.2);ctx.lineTo(x+10,y-15);ctx.fill();ctx.fillStyle=p.deadTime>0?'#5d6a64':'#7048b6';ctx.fillRect(x-11,y-3,22,24);ctx.fillStyle='#e7d1ff';ctx.fillRect(x-5,y,10,20);ctx.strokeStyle='#f8e7a8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+14,y-10);ctx.lineTo(x+22,y+20);ctx.stroke();ctx.fillStyle='#ffce4d';ctx.beginPath();ctx.arc(x+14,y-12,5,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(p.deadTime>0?'💤 裝死':p.job,x,y-39)}else{let e=o.e,x=sx(e.x),y=sy(e.y);if(x<-50||x>W+50||y<-50||y>H+50)continue;ellipse(x,y+15,20,7,'#304e3488');let col=e.type===0?'#f8a7bf':e.type===1?'#92e39c':'#f3e4c0';ellipse(x,y,20,e.type===2?23:17,e.hit?'#fff':col);if(e.type===2){ellipse(x-13,y-20,6,15,'#f3e4c0');ellipse(x+13,y-20,6,15,'#f3e4c0')}ellipse(x-7,y-1,2,3,'#343d37');ellipse(x+7,y-1,2,3,'#343d37');ctx.strokeStyle='#653c50';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y+3,4,0,Math.PI);ctx.stroke()}}for(const s of shots){let x=sx(s.x),y=sy(s.y);ellipse(x,y,s.type==='fire'?11:8,s.type==='fire'?11:14,s.type==='bash'?'#fff5cd':s.type==='fire'?'#ff8c28':'#f4f56e');ellipse(x,y,4,5,'#fff7c0')}for(const f of effects){let x=sx(f.x),y=sy(f.y);ctx.globalAlpha=Math.max(0,Math.min(1,f.t*2));if(f.ring){ctx.strokeStyle='#a7e9ff';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(x,y,f.ring,f.ring*.78,0,0,7);ctx.stroke()}else{ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText(f.text,x,y-30+(1-f.t)*25)}ctx.globalAlpha=1}}}let lastFrame=performance.now();function loop(now){let dt=Math.min(.035,(now-lastFrame)/1000||0);lastFrame=now;if(state==='play'&&!devOpen&&!rpgOpen)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function toggleDev(force){if(!p||state==='menu'||state==='dead')return;if(rpgOpen)rpgClose();devOpen=force===undefined?!devOpen:force;$('devPanel').classList.toggle('hide',!devOpen);if(!devOpen)last=performance.now()}
$('devToggle').onclick=()=>toggleDev();$('devClose').onclick=()=>toggleDev(false);
addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();toggleDev()}});
function devReady(){return p&&state==='play'&&devOpen}
$('devApply').onclick=()=>{if(!devReady())return;let stage=Number($('devStage').value),root=$('devRoot').value,branch=Number($('devBranch').value);let sex=$('devSex').value;p.sex=sex;if(root==='弓箭手'&&branch===1&&sex==='female')branch=2;if(root==='弓箭手'&&branch===2&&sex==='male')branch=1;p.root=stage?root:null;p.branch=stage>=2?branch:-1;p.career=stage;p.job=stage===0?'初心者':stage===1?root:JOBS[root][branch][stage-2];p.power=Math.pow(1.18,stage);p.fire=stage?Math.max(1,stage):0;p.light=stage?Math.max(1,stage):0;p.ice=stage>=2?stage-1:0;p.inv=3;p.jobLv=1;p.jobXp=0;p.jobNeed=10;refreshDerived(true);elapsed=stage===0?0:Math.max(elapsed,stage===5?300:MILESTONES[stage-1]);updateHud()};
$('devLevel').onclick=()=>{if(!devReady())return;for(let i=0;i<10;i++){p.lv++;p.statPts+=3+Math.floor(p.lv/15);p.need=Math.ceil(p.need*1.115+4)}p.xp=0;refreshDerived();updateHud()};$('devBase').onclick=$('devLevel').onclick;$('devJob').onclick=()=>{if(!devReady())return;p.jobLv+=10;p.skillPts+=10;p.jobNeed=Math.ceil(p.jobNeed*3);p.jobXp=0;updateHud()};$('devStats').onclick=()=>{if(!devReady())return;p.statPts+=30;updateHud()};$('devSkills').onclick=()=>{if(!devReady())return;p.skillPts+=10;updateHud()};$('devReset').onclick=()=>{if(!devReady())return;for(const k of STAT_NAMES){let v=p.stats[k];for(let x=1;x<v;x++)p.statPts+=1+Math.floor(x/10);p.stats[k]=1}refreshDerived();updateHud()};
$('devHeal').onclick=()=>{if(!devReady())return;p.hp=p.max;updateHud()};
$('devInv').onclick=()=>{if(!devReady())return;p.inv=60;updateHud()};
$('devClear').onclick=()=>{if(!devReady())return;enemies=[];updateHud()};
$('devSpawn').onclick=()=>{if(!devReady())return;for(let i=0;i<20;i++)monster();updateHud()};
$('devBoost').onclick=()=>{if(!devReady())return;p.bash=Math.min(10,p.bash+1);p.aid=1;p.deadLv=1;if(p.career>0){p.fire=Math.min(10,p.fire+1);p.light=Math.min(10,p.light+1)}if(p.career>=2)p.ice=Math.min(10,p.ice+1);updateHud()};
</script></body></html>
