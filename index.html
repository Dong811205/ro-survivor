function monster(){let a=rand()*Math.PI*2,r=Math.max(W,H)*.65;let kind=rand(),type=kind<.52?0:kind<.83?1:2;enemies.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,type,hp:[30,44,24][type]+elapsed*.085,max:[30,44,24][type]+elapsed*.085,speed:[53,42,87][type]+Math.min(38,elapsed*.06),hit:0})}function nearest(range){let best=null,d=range*range;for(const e of enemies){let v=(e.x-p.x)**2+(e.y-p.y)**2;if(v<d){d=v;best=e}}return best}function projectile(target,type){if(!target)return;shots.push({x:p.x,y:p.y,tx:target.x,ty:target.y,vx:0,vy:0,type,life:2});let s=shots[shots.length-1],dx=target.x-p.x,dy=target.y-p.y,l=Math.hypot(dx,dy)||1;s.vx=dx/l*(type==='light'?720:420);s.vy=dy/l*(type==='light'?720:420)}function damage(e,d){e.hp-=d;e.hit=.15;effects.push({x:e.x,y:e.y,text:String(Math.round(d)),t:.55});if(e.hp<=0){kills++;gems.push({x:e.x,y:e.y,v:e.type===1?3:2});enemies.splice(enemies.indexOf(e),1)}}function level(){state='level';const opts=[['🔥 火球術 +1','提升火球傷害',()=>p.fire++],['⚡ 雷擊術 +1','提升雷擊傷害',()=>p.light++],['❄️ 暴風雪','解鎖或強化範圍冰系攻擊',()=>p.ice++],['❤️ 生命強化','最大 HP +35 並恢復生命',()=>{p.max+=35;p.hp=Math.min(p.max,p.hp+55)}],['👟 移動速度','移動速度 +12%',()=>p.speed*=1.12]];if(p.career===0){opts.splice(0,3,['🗡️ 重擊 +1','增加重擊傷害',()=>p.bash++],['💚 緊急治療 +1','增加治療量',()=>p.aid++],['💤 裝死 +1','減少冷卻時間',()=>p.deadLv++])}opts.sort(()=>rand()-.5);show('升級！ Lv.'+p.lv,'選擇一項能力強化',opts.slice(0,3).map(([a,b,fn])=>[a+' — '+b,()=>{fn();state='play';$('overlay').classList.add('hide');last=performance.now()}]))}function update(dt){if(devOpen)return;elapsed+=dt;careerUpgrade();if(state!=='play')return;p.inv=Math.max(0,p.inv-dt);p.aidCd=Math.max(0,p.aidCd-dt);p.deadCd=Math.max(0,p.deadCd-dt);p.deadTime=Math.max(0,p.deadTime-dt);if(p.hp<p.max*.6&&p.aidCd===0){let heal=Math.ceil(p.max*(.08+.025*p.aid));p.hp=Math.min(p.max,p.hp+heal);p.aidCd=15;effects.push({x:p.x,y:p.y,text:'+'+heal,t:.7})}if(p.hp<p.max*.25&&p.deadCd===0&&p.deadTime===0){p.deadTime=3;p.deadCd=Math.max(20,45-4*(p.deadLv-1));p.inv=Math.max(p.inv $('devSpawn').onclick=()=>{if(!devReady())return;for(let i=0;i<20;i++)monster();updateHud()};
